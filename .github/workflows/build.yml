name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Only the windows/macos matrix rows need these now: linux, android, the
  # checks and the images all come from flake.nix.
  # pkgconfiglite package is broken upstream (404), skip to keep Windows builds green
  CHOCOLATEY_PACKAGES: "cmake strawberryperl llvm nasm"
  HOMEBREW_PACKAGES: "llvm"
  BIN_NAME: "clewdr"
permissions:
  contents: write
  packages: write

# A new push to a branch makes the previous run's results irrelevant, and the
# matrix is expensive enough that leaving superseded runs going is the single
# biggest source of queue contention.
#
# Tags are exempt, so a release build is never cancelled by a later push. The
# event name is part of the group because a manual dispatch builds the full
# matrix: without it, a push to master would cancel a dispatch someone started
# on master to get artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `cargo xtask ci` (fmt --check, lint, test) inside one cached nix
  # derivation — same entry point developers run locally via `nix develop`.
  # The nix store is the cache (magic-nix-cache), so there is no rust-cache
  # step: a flake input change is the only thing that invalidates it.
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Run checks
        run: nix build -L .#checks.x86_64-linux.ci

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build frontend (trunk, sandboxed, tools pinned by the flake)
        run: nix build -L -o static-out .#static

      - name: Upload static directory
        uses: actions/upload-artifact@v7
        with:
          name: static-files
          path: static-out/
          retention-days: 1

  # The non-linux rows of the old matrix: windows and macos. Linux and android
  # moved to `build-linux`, one nix job per target.
  build:
    name: Build binary
    needs: build-frontend
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        os: [windows, macos]
        target_arch: [x86_64, aarch64]
        include:
          # rust target vendor + system + environment
          - os: macos
            target_vendor_sys_env: apple-darwin
          - os: windows
            target_vendor_sys_env: pc-windows-msvc
          # runner
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute target triple
        shell: bash
        id: target
        run: echo "triple=${{ matrix.target_arch }}-${{matrix.target_vendor_sys_env}}" >> $GITHUB_OUTPUT

      # Pinned instead of `rustup update`, which floats. rust-cache keys on the
      # rustc version, so every new stable release used to invalidate all nine
      # matrix caches at the same moment and force nine cold builds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.triple }}

      - name: Install Chocolatey Packages
        if: matrix.os == 'windows'
        run: |
          choco install -y --ignore-unfound ${{ env.CHOCOLATEY_PACKAGES }}

      - name: Install Homebrew Packages
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install ${{ env.HOMEBREW_PACKAGES }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.target.outputs.triple }}

      - name: Prepare build env
        shell: bash
        run: |
          echo "FEATURE_ARGS=--no-default-features --features embed-resource,portable" >> $GITHUB_ENV

      - name: Download static files
        uses: actions/download-artifact@v8
        with:
          name: static-files
          path: static

      - name: Build ${{ steps.target.outputs.triple }}
        shell: bash
        run: |
          if [ ${{ matrix.os }} == "windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release -p clewdr --target ${{ steps.target.outputs.triple }} $FEATURE_ARGS

      - name: Move artifact to work dir and zip
        shell: bash
        run: |
          mv target/${{ steps.target.outputs.triple }}/release/${{ env.BIN_NAME }} .
          mkdir -p release-package
          mv ${{ env.BIN_NAME }} release-package/
          cd release-package
          if [ ${{ matrix.os }} == "windows" ]; then
            7z a -tzip ../${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip *
          else
            zip -r ../${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}
          path: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip
          retention-days: 1

  # The four linux targets plus android, cross-built by nix. One job per
  # target: the release profile is `lto = true` with `codegen-units = 1`, so
  # the final link is essentially single-threaded (measured: 57s on 4 cores vs
  # 55s on 32), and building all five in one job just serialises five
  # single-threaded links. This replaces the linux-gnu (native arm runner),
  # musllinux (cross + docker) and android (NDK + cargo-ndk) matrix rows,
  # plus the CXX/RUSTFLAGS/CFLAGS env hacks they carried.
  #
  # `needs: build-frontend` is for the nix cache, not for artifacts: it lets
  # these jobs fetch the frontend derivation instead of each rebuilding it.
  build-linux:
    name: Build ${{ matrix.name }} (nix)
    needs: build-frontend
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            attr: clewdr-gnu-x86_64
          - name: musllinux-x86_64
            attr: clewdr-musl-x86_64
          - name: linux-aarch64
            attr: clewdr-gnu-aarch64
          - name: musllinux-aarch64
            attr: clewdr-musl-aarch64
          - name: android-aarch64
            attr: clewdr-android-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build ${{ matrix.attr }}
        run: nix build -L -o out .#${{ matrix.attr }}

      # Artifact names match what the release job's glob expects. The android
      # output carries libc++_shared.so beside the binary (rpath is $ORIGIN),
      # so the whole bin/ directory goes in. zip comes from the runner image,
      # as it did for the old linux matrix rows.
      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp out/bin/* pkg/
          (cd pkg && zip -r "../${{ env.BIN_NAME }}-${{ matrix.name }}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.name }}
          path: ${{ env.BIN_NAME }}-${{ matrix.name }}.zip
          retention-days: 1

  # Stands in for the release builds on pull requests and master pushes.
  # `check` covers the four feature combinations through clippy on the dev
  # profile; this covers the one thing it cannot: that the release profile
  # with embed-resource actually builds and links.
  smoke:
    name: Smoke build (release profile)
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build
        run: nix build -L .#checks.x86_64-linux.smoke

  # Builds the two distroless images (pinned by digest in the flake) and, on
  # pushes, joins them into multi-arch manifests. No docker daemon, no QEMU:
  # the arm64 image is cross-assembled, and crane talks to the registry
  # directly. Replaces docker-build.yml and the Dockerfile.
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build images
        run: |
          nix build -L -o image-amd64.tar.gz .#image-amd64
          nix build -L -o image-arm64.tar.gz .#image-arm64

      - name: Push images and multi-arch manifests
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}" # ghcr.io is case-insensitive

          tags=()
          case "$GITHUB_REF" in
            refs/tags/*) tags+=("${GITHUB_REF#refs/tags/}" "latest") ;;
            refs/heads/*) tags+=("${GITHUB_REF#refs/heads/}") ;;
          esac
          tags+=("$GITHUB_SHA")

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | nix run .#crane -- auth login ghcr.io -u "${{ github.actor }}" --password-stdin

          for tag in "${tags[@]}"; do
            nix run .#crane -- push image-amd64.tar.gz "$IMAGE:$tag-amd64"
            nix run .#crane -- push image-arm64.tar.gz "$IMAGE:$tag-arm64"
            nix run .#crane -- index append -t "$IMAGE:$tag" \
              -m "$IMAGE:$tag-amd64" -m "$IMAGE:$tag-arm64"
          done

  release:
    name: Create Release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master # Ensure we get the latest master with RELEASE_NOTES.md
          fetch-depth: 0 # Full history for consistency

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/${{ env.BIN_NAME }}*.zip
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md # Use release notes file
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
