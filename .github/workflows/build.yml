name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Only the windows/macos matrix rows need these now: linux, android, the
  # checks and the images all come from flake.nix.
  # pkgconfiglite package is broken upstream (404), skip to keep Windows builds green
  CHOCOLATEY_PACKAGES: "cmake strawberryperl llvm nasm"
  HOMEBREW_PACKAGES: "llvm"
  BIN_NAME: "clewdr"
permissions:
  contents: write
  packages: write

# A new push to a branch makes the previous run's results irrelevant, and the
# matrix is expensive enough that leaving superseded runs going is the single
# biggest source of queue contention.
#
# Tags are exempt, so a release build is never cancelled by a later push. The
# event name is part of the group because a manual dispatch builds the full
# matrix: without it, a push to master would cancel a dispatch someone started
# on master to get artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `cargo xtask ci` (fmt --check, lint, test) inside one cached nix
  # derivation — same entry point developers run locally via `nix develop`.
  # No rust-cache step, and no nix binary cache either: see the comment above
  # the installer below.
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `determinate: false` installs upstream Nix. Determinate Nix logs in to
      # FlakeHub on startup, which fails here, and manages its own nix.conf.
      #
      # There is deliberately no binary cache. Measured footprint: 1.4 GB per
      # commit-state (5x188 MB of cross dependency artifacts, 335 MB for the
      # checks ones, plus binaries and images) on top of 3.5 GB that changes
      # only with the pins (3.07 GB of rust-overlay toolchains, 0.41 GB of
      # vendored crates). The GitHub Actions cache holds 10 GB and was already
      # at 10.65 GB, which is how writes started failing silently; Cachix's
      # free tier is 5 GB, which fits exactly one commit-state; FlakeHub Cache
      # has no free tier. A 10 GB Cloudflare R2 bucket as a native nix S3
      # store is the option to reach for if these jobs ever get too slow to
      # live with - see wiki/nix-convergence.md.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false


      - name: Run checks
        run: nix build -L .#checks.x86_64-linux.ci

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false


      - name: Build frontend (trunk, sandboxed, tools pinned by the flake)
        run: nix build -L -o static-out .#static

      # Two artifacts from one build. The directory is for the windows/macos
      # jobs, which build with cargo and need the files on disk. The NAR is
      # the same output as a store path, so the nix jobs can import it and
      # skip the 4-minute wasm build instead of hoping the binary cache
      # substitutes it (measured: it did not, in every one of the five jobs).
      # Importing is not impure: the path is exactly this derivation's output,
      # so nix treats the build as already done.
      - name: Export frontend as a store path
        run: nix-store --export "$(readlink -f static-out)" > static.nar

      - name: Upload static directory
        uses: actions/upload-artifact@v7
        with:
          name: static-files
          path: static-out/
          retention-days: 1

      - name: Upload frontend store path
        uses: actions/upload-artifact@v7
        with:
          name: static-nar
          path: static.nar
          retention-days: 1

  # The non-linux rows of the old matrix: windows and macos. Linux and android
  # moved to `build-linux`, one nix job per target.
  build:
    name: Build binary
    needs: build-frontend
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        os: [windows, macos]
        target_arch: [x86_64, aarch64]
        include:
          # rust target vendor + system + environment
          - os: macos
            target_vendor_sys_env: apple-darwin
          - os: windows
            target_vendor_sys_env: pc-windows-msvc
          # runner
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute target triple
        shell: bash
        id: target
        run: echo "triple=${{ matrix.target_arch }}-${{matrix.target_vendor_sys_env}}" >> "$GITHUB_OUTPUT"

      # Pinned instead of `rustup update`, which floats. rust-cache keys on the
      # rustc version, so every new stable release used to invalidate all nine
      # matrix caches at the same moment and force nine cold builds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.triple }}

      - name: Install Chocolatey Packages
        if: matrix.os == 'windows'
        run: |
          choco install -y --ignore-unfound ${{ env.CHOCOLATEY_PACKAGES }}

      - name: Install Homebrew Packages
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install ${{ env.HOMEBREW_PACKAGES }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.target.outputs.triple }}

      - name: Download static files
        uses: actions/download-artifact@v8
        with:
          name: static-files
          path: static

      - name: Build ${{ steps.target.outputs.triple }}
        shell: bash
        run: |
          if [ ${{ matrix.os }} == "windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release -p clewdr \
            --target ${{ steps.target.outputs.triple }} \
            --no-default-features --features embed-resource,portable

      - name: Move artifact to work dir and zip
        shell: bash
        run: |
          mv target/${{ steps.target.outputs.triple }}/release/${{ env.BIN_NAME }} .
          mkdir -p release-package
          mv ${{ env.BIN_NAME }} release-package/
          cd release-package
          if [ ${{ matrix.os }} == "windows" ]; then
            7z a -tzip "../${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip" ./*
          else
            zip -r ../${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}
          path: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip
          retention-days: 1

  # The four linux targets plus android, cross-built by nix. One job per
  # target: the release profile is `lto = true` with `codegen-units = 1`, so
  # the final link is essentially single-threaded (measured: 57s on 4 cores vs
  # 55s on 32), and building all five in one job just serialises five
  # single-threaded links. This replaces the linux-gnu (native arm runner),
  # musllinux (cross + docker) and android (NDK + cargo-ndk) matrix rows,
  # plus the CXX/RUSTFLAGS/CFLAGS env hacks they carried.
  #
  # `needs: build-frontend` is for the frontend store path, which these jobs
  # import instead of rebuilding.
  build-linux:
    name: Build ${{ matrix.name }} (nix)
    needs: build-frontend
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            attr: clewdr-gnu-x86_64
          - name: musllinux-x86_64
            attr: clewdr-musl-x86_64
          - name: linux-aarch64
            attr: clewdr-gnu-aarch64
          - name: musllinux-aarch64
            attr: clewdr-musl-aarch64
          - name: android-aarch64
            attr: clewdr-android-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false


      - name: Download frontend store path
        uses: actions/download-artifact@v8
        with:
          name: static-nar

      - name: Import frontend store path
        run: nix-store --import < static.nar

      - name: Build ${{ matrix.attr }}
        run: nix build -L -o out .#${{ matrix.attr }}

      # Artifact names match what the release job's glob expects. The android
      # output carries libc++_shared.so beside the binary (rpath is $ORIGIN),
      # so the whole bin/ directory goes in. zip comes from the runner image,
      # as it did for the old linux matrix rows.
      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp out/bin/* pkg/
          (cd pkg && zip -r "../${{ env.BIN_NAME }}-${{ matrix.name }}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.name }}
          path: ${{ env.BIN_NAME }}-${{ matrix.name }}.zip
          retention-days: 1

  # Stands in for the release builds on pull requests and master pushes.
  # `check` covers the four feature combinations through clippy on the dev
  # profile; this covers the one thing it cannot: that the release profile
  # with embed-resource actually builds and links.
  smoke:
    name: Smoke build (release profile)
    needs: build-frontend
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false


      - name: Download frontend store path
        uses: actions/download-artifact@v8
        with:
          name: static-nar

      - name: Import frontend store path
        run: nix-store --import < static.nar

      - name: Build
        run: nix build -L .#checks.x86_64-linux.smoke

  # Builds the two distroless images (pinned by digest in the flake) and, on
  # pushes, joins them into multi-arch manifests. No docker daemon, no QEMU:
  # the arm64 image is cross-assembled, and crane talks to the registry
  # directly. Replaces docker-build.yml and the Dockerfile.
  docker:
    name: Build and publish Docker image
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false


      - name: Download frontend store path
        uses: actions/download-artifact@v8
        with:
          name: static-nar

      - name: Import frontend store path
        run: nix-store --import < static.nar

      - name: Build images
        # One invocation, so nix can overlap the two architectures. As two
        # commands they were strictly sequential: measured 7 minutes, in which
        # aarch64's dependency build did not start until x86_64's LTO-bound
        # final build had finished. -o takes a single value, hence nix eval to
        # read the paths back instead of out-links.
        run: |
          set -euo pipefail
          nix build -L -j 2 --no-link .#image-amd64 .#image-arm64
          {
            echo "IMAGE_AMD64=$(nix eval --raw .#image-amd64)"
            echo "IMAGE_ARM64=$(nix eval --raw .#image-arm64)"
          } >> "$GITHUB_ENV"

      - name: Push images and multi-arch manifests
        # Only for real pushes: a manual dispatch is for getting artifacts, and
        # the workflow it replaced (docker-build.yml) had no dispatch trigger,
        # so dispatching must not publish anything.
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        # The same script `cargo xtask verify-push` runs against a local
        # registry, so the tag scheme and the crane calls are checkable without
        # pushing a commit.
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | nix shell .#crane -c crane auth login ghcr.io \
                -u "${{ github.actor }}" --password-stdin
          nix shell .#crane -c ./publish-images.sh \
            "$IMAGE" "$GITHUB_REF" "$GITHUB_SHA" \
            "$IMAGE_AMD64" "$IMAGE_ARM64"

  release:
    name: Create Release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master # Ensure we get the latest master with RELEASE_NOTES.md
          fetch-depth: 0 # Full history for consistency

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/${{ env.BIN_NAME }}*.zip
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md # Use release notes file
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
