name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APT_PACKAGES: "build-essential cmake perl pkg-config libclang-dev"
  # pkgconfiglite package is broken upstream (404), skip to keep Windows builds green
  CHOCOLATEY_PACKAGES: "cmake strawberryperl llvm nasm"
  HOMEBREW_PACKAGES: "llvm"
  BIN_NAME: "clewdr"
permissions:
  contents: write

# A new push to a branch makes the previous run's results irrelevant, and the
# matrix is expensive enough that leaving superseded runs going is the single
# biggest source of queue contention.
#
# Tags are exempt, so a release build is never cancelled by a later push. The
# event name is part of the group because a manual dispatch builds the full
# matrix: without it, a push to master would cancel a dispatch someone started
# on master to get artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Order matters. Each of these sets the toolchain it installs as the
      # default, and xtask reaches nightly explicitly via `rustup run nightly`
      # for formatting only. Installing nightly last would leave it the
      # default for everything else, and `cargo clippy` would then resolve to
      # a toolchain with no clippy component.

      # rustfmt comes from nightly because .rustfmt.toml uses nightly-only
      # options; stable silently ignores them, so a stable-only check would
      # pass while leaving imports unformatted.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}

      - uses: Swatinem/rust-cache@v2

      # Same entry point developers use, so the two cannot drift apart.
      - name: Run checks
        run: cargo xtask ci

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: cargo-bins/cargo-binstall@main

      - name: Install trunk
        run: cargo binstall trunk --no-confirm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clewdr-frontend

      - name: Build frontend
        run: |
          cd clewdr-frontend
          trunk build --release

      - name: Upload static directory
        uses: actions/upload-artifact@v7
        with:
          name: static-files
          path: static/
          retention-days: 1

  # This matrix exists to produce release artifacts, so it runs when a release
  # is being made. On pull requests it was building nine cross-platform
  # binaries, zipping them, uploading them, and discarding them a day later.
  # Those runs get the `smoke` job below instead.
  build:
    name: Build binary
    needs: build-frontend
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        os: [linux, musllinux, android, windows, macos]
        target_arch: [x86_64, aarch64]
        include:
          # rust target vendor + system + environment
          - os: android
            target_vendor_sys_env: linux-android
          - os: macos
            target_vendor_sys_env: apple-darwin
          - os: linux
            target_vendor_sys_env: unknown-linux-gnu
          - os: musllinux
            target_vendor_sys_env: unknown-linux-musl
          - os: windows
            target_vendor_sys_env: pc-windows-msvc
          # runner
          - os: linux
            target_arch: x86_64
            runner: ubuntu-latest
          - os: linux
            target_arch: aarch64
            runner: ubuntu-24.04-arm
          - os: android
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
          # musl packages
          - os: musllinux
            cross: true
            runner: ubuntu-latest
        exclude:
          - os: android
            target_arch: x86_64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute target triple
        shell: bash
        id: target
        run: echo "triple=${{ matrix.target_arch }}-${{matrix.target_vendor_sys_env}}" >> $GITHUB_OUTPUT

      # Pinned instead of `rustup update`, which floats. rust-cache keys on the
      # rustc version, so every new stable release used to invalidate all nine
      # matrix caches at the same moment and force nine cold builds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.triple }}

      - uses: nttld/setup-ndk@v1
        if: ${{ matrix.os == 'android' }}
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install APT packages
        if: contains(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}

      - name: Install Chocolatey Packages
        if: matrix.os == 'windows'
        run: |
          choco install -y --ignore-unfound ${{ env.CHOCOLATEY_PACKAGES }}

      - name: Install Homebrew Packages
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install ${{ env.HOMEBREW_PACKAGES }}

      # Downloads a prebuilt binary, falling back to a source build only if no
      # release matches. `cargo install cross` ran ahead of the cache step
      # below, so it had nothing to restore from and recompiled cross from
      # source on every musllinux run.
      - uses: cargo-bins/cargo-binstall@main
        if: ${{ matrix.cross || matrix.os == 'android' }}

      - name: Install cross
        if: ${{ matrix.cross }}
        run: |
          cargo binstall cross --no-confirm
          echo "CROSS_NO_DEFAULT_TOOLCHAIN=1" >> $GITHUB_ENV

      - name: Install cargo-ndk
        if: ${{ matrix.os == 'android' }}
        run: cargo binstall cargo-ndk --no-confirm

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.target.outputs.triple }}

      - name: Prepare build env
        shell: bash
        run: |
          echo "FEATURE_ARGS=--no-default-features --features embed-resource,portable" >> $GITHUB_ENV

      - name: Download static files
        uses: actions/download-artifact@v8
        with:
          name: static-files
          path: static

      - name: Build ${{ steps.target.outputs.triple }}
        if: ${{ matrix.os != 'android' }}
        shell: bash
        run: |
          if [ ${{ matrix.os }} == "musllinux" ] && [ "${{ matrix.cross }}" != "true" ]; then
            export CXX=${{ matrix.target_arch }}-linux-gnu-g++
            if [ ${{ matrix.target_arch }} == "aarch64" ]; then
              export RUSTFLAGS='-C link-arg=-Wl,--allow-shlib-undefined'
              export CFLAGS="-D_FILE_OFFSET_BITS=64"
            fi
          fi
          if [ ${{ matrix.os }} == "windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ steps.target.outputs.triple }} $FEATURE_ARGS
          else
            cargo build --release --target ${{ steps.target.outputs.triple }} $FEATURE_ARGS
          fi

      - name: Build with Android NDK
        if: ${{ matrix.os == 'android' }}
        run: cargo ndk --target ${{ steps.target.outputs.triple }} build --release $FEATURE_ARGS
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Move artifact to work dir and zip
        shell: bash
        run: |
          mv target/${{ steps.target.outputs.triple }}/release/${{ env.BIN_NAME }} .
          mkdir -p release-package
          mv ${{ env.BIN_NAME }} release-package/
          if [ ${{ matrix.os }} == "android" ]; then
            mv ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.target_arch }}-linux-android/libc++_shared.so release-package/
          fi
          cd release-package
          if [ ${{ matrix.os }} == "windows" ]; then
            7z a -tzip ../${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip *
          else
            zip -r ../${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}
          path: ${{ env.BIN_NAME }}-${{ matrix.os }}-${{matrix.target_arch}}.zip
          retention-days: 1

  # Stands in for the matrix on pull requests and master pushes. `check`
  # already covers all four feature combinations, but only through clippy on
  # the dev profile; this covers the one thing it cannot, that the release
  # profile and the embed-resource feature actually build and link.
  smoke:
    name: Smoke build (release profile)
    needs: build-frontend
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke

      # embed-resource compiles static/ into the binary, so the frontend has to
      # exist before this builds.
      - name: Download static files
        uses: actions/download-artifact@v8
        with:
          name: static-files
          path: static

      - name: Build
        run: cargo build --release --no-default-features --features embed-resource,portable

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master # Ensure we get the latest master with RELEASE_NOTES.md
          fetch-depth: 0 # Full history for consistency

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/${{ env.BIN_NAME }}*.zip
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md # Use release notes file
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
