[package]
name = "clewdr"
version = "0.13.2"
edition = "2024"
authors = ["Xerxes-2 <dspxue@gmail.com>", "LeenHawk <leenhawk@leenhawk.com>"]
license = "AGPL-3.0"

[workspace]
members = [".", "clewdr-types", "clewdr-frontend", "xtask"]
# xtask is a build tool, not part of the product: keeping it out of the default
# set means a bare `cargo build` still builds only what ships. `--workspace`
# still picks it up, so it is linted and formatted along with everything else.
default-members = [".", "clewdr-types", "clewdr-frontend"]

# Lint policy for every member. Deliberately has no `allow` entries: where a
# pedantic lint genuinely does not apply, the exception goes at the site with a
# comment explaining why, so it stays visible in review.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-auth = "0.8"
# Held one minor behind: oauth2, tiktoken-rs and axum-auth all pull base64
# 0.22, and 0.23 is a semver-incompatible second copy for no gain here. Bump
# once those three have moved.
base64 = "0.22"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clewdr-types = { path = "clewdr-types", features = ["display"] }
colored = "3"
console-subscriber = { version = "0.5", optional = true }
etcetera = { version = "0.11", optional = true }
eventsource-stream = "0.2"
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
hex = "0.4"
http = "1"
include_dir = { version = "0.7", optional = true }
mimalloc = { version = "0.1" }
moka = { version = "0.12", features = ["sync"] }
oauth2 = { version = "5", default-features = false }
passwords = "3"
regex = "1"
self-replace = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["chrono_0_4"] }
# Held one minor behind to share oauth2's copy; 0.11 drags in a parallel
# digest/block-buffer/crypto-common stack. Bump once oauth2 has moved.
sha2 = "0.10"
snafu = { version = "0.9", features = ["futures", "rust_1_81"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = { version = "3", optional = true }
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = [
  "compression-zstd",
  "cors",
  "trace",
] }
tower-serve-static = { version = "0.1", optional = true }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
  "chrono",
  "env-filter",
] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Held at rc.29's predecessor: rc.29 swapped the TLS backend from boring2 to
# btls, whose vendored BoringSSL cannot be built for musl in the Docker image.
# See the comment above the backend-builder stage in Dockerfile.
wreq = { version = "6.0.0-rc.29", features = [
  "cookies",
  "json",
  "multipart",
  "socks",
  "stream",
] }
wreq-util = "3.0.0-rc.14"
zip = { version = "8", default-features = false, features = [
  "deflate",
], optional = true }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"

[features]
default = ["external-resource", "portable"]
embed-resource = ["dep:include_dir", "dep:tower-serve-static"]
external-resource = ["tower-http/fs"]
portable = ["dep:self-replace", "dep:tempfile", "dep:zip"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
xdg = ["dep:etcetera"]

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
